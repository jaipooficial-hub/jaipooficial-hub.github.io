<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Fondo Negro Consola -->
  <rect width="16" height="16" fill="#000000"/>

  <!-- _ Cursor Terminal (Verde Consola) -->
  <rect x="1" y="11" width="6" height="2" fill="#00ff00"/>

  <!-- a Caracter Pixelado Consola (Verde Consola) -->
  <!-- Barra superior curvada de 'a' -->
  <rect x="10" y="4" width="4" height="1" fill="#00ff00"/>
  <!-- Lado derecho superior -->
  <rect x="13" y="5" width="1" height="1" fill="#00ff00"/>
  <!-- Barra horizontal media -->
  <rect x="9" y="6" width="5" height="1" fill="#00ff00"/>
  <!-- Lado izquierdo del bucle -->
  <rect x="8" y="7" width="1" height="3" fill="#00ff00"/>
  <!-- Lado derecho del bucle (tallo principal) -->
  <rect x="13" y="7" width="1" height="3" fill="#00ff00"/>
  <!-- Base inferior del bucle y pie retro -->
  <rect x="9" y="10" width="6" height="1" fill="#00ff00"/>
</svg>
